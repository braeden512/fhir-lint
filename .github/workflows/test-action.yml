name: Test GitHub Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-action:
    name: Test Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Fat JAR
        run: ./gradlew fatJar --no-daemon

      - name: Test Action on Clean Dataset with SARIF (Pass Expectation)
        id: clean-test
        uses: ./
        with:
          path: 'sample-data/clean/clean-bundle.json'
          profile: 'US_CORE'
          format: 'table'
          min-score: 80
          fail-on: 'error'
          upload-sarif: 'true'

      - name: Verify Clean Dataset Outputs
        shell: bash
        run: |
          echo "Score: ${{ steps.clean-test.outputs.score }}"
          echo "Grade: ${{ steps.clean-test.outputs.grade }}"
          echo "Passed: ${{ steps.clean-test.outputs.passed }}"
          if [ "${{ steps.clean-test.outputs.passed }}" != "true" ]; then
            echo "Expected passed=true for clean dataset"
            exit 1
          fi

      - name: Test Action on Degraded Dataset (Expected Gate Failure)
        id: messy-test
        continue-on-error: true
        uses: ./
        with:
          path: 'sample-data/messy/messy-bundle.json'
          min-score: 95
          fail-on: 'error'

      - name: Verify Degraded Dataset Outputs
        shell: bash
        run: |
          echo "Score: ${{ steps.messy-test.outputs.score }}"
          echo "Passed: ${{ steps.messy-test.outputs.passed }}"
          if [ "${{ steps.messy-test.outputs.passed }}" != "false" ]; then
            echo "Expected passed=false for messy dataset"
            exit 1
          fi
