plugins {
	id 'java'
	id 'application'
}

group = 'com.braeden'
version = '0.1.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

application {
	mainClass = 'com.braeden.fhirlint.cli.FhirLintApplication'
}

repositories {
	mavenCentral()
}

dependencies {
	// HAPI FHIR R4
	implementation 'ca.uhn.hapi.fhir:hapi-fhir-base:6.10.0'
	implementation 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:6.10.0'
	implementation 'ca.uhn.hapi.fhir:hapi-fhir-validation:6.10.0'
	implementation 'ca.uhn.hapi.fhir:hapi-fhir-validation-resources-r4:6.10.0'

	// Picocli CLI Framework
	implementation 'info.picocli:picocli:4.7.6'
	annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

	// JSON & Serialization
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

	// Logging
	implementation 'org.slf4j:slf4j-api:2.0.16'
	implementation 'ch.qos.logback:logback-classic:1.5.16'

	// Testing
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testImplementation 'org.assertj:assertj-core:3.27.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

jar {
	manifest {
		attributes 'Main-Class': 'com.braeden.fhirlint.cli.FhirLintApplication'
	}
}
