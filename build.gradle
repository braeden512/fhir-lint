plugins {
	id 'java'
	id 'application'
	id 'org.graalvm.buildtools.native' version '0.10.4'
}

group = 'org.fhirlint'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

application {
	mainClass = 'org.fhirlint.cli.FhirLintApplication'
}

repositories {
	mavenCentral()
}

dependencies {
	// HAPI FHIR R4
	implementation 'ca.uhn.hapi.fhir:hapi-fhir-base:6.10.0'
	implementation 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:6.10.0'
	implementation 'ca.uhn.hapi.fhir:hapi-fhir-validation:6.10.0'
	implementation 'ca.uhn.hapi.fhir:hapi-fhir-validation-resources-r4:6.10.0'

	// Picocli CLI Framework
	implementation 'info.picocli:picocli:4.7.6'
	annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

	// JSON & Serialization
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

	// Logging
	implementation 'org.slf4j:slf4j-api:2.0.16'
	implementation 'ch.qos.logback:logback-classic:1.5.16'

	// Testing
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testImplementation 'org.assertj:assertj-core:3.27.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	dependsOn tasks.named('fatJar')
}

tasks.named('run') {
	standardInput = System.in
}

jar {
	manifest {
		attributes 'Main-Class': 'org.fhirlint.cli.FhirLintApplication'
	}
}

tasks.register('fatJar', Jar) {
	archiveFileName = 'fhir-lint-all.jar'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	manifest {
		attributes 'Main-Class': 'org.fhirlint.cli.FhirLintApplication'
	}
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
	exclude 'META-INF/native-image/org.xerial/**'
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
	with tasks.named('jar').get()
}

graalvmNative {
	agent {
		defaultMode = 'standard'
		enabled = project.hasProperty('agent')
	}
	binaries {
		main {
			imageName = 'fhir-lint'
			mainClass = 'org.fhirlint.cli.FhirLintApplication'
			buildArgs.addAll(
				'--no-fallback',
				'-H:+ReportExceptionStackTraces',
				'--enable-url-protocols=http,https',
				'--initialize-at-build-time=ca.uhn.fhir.context.FhirVersionEnum',
				'-H:NumberOfThreads=2',
				'-J-XX:-UseGCOverheadLimit',
				'-J-Xmx6g',
				'-Ob'
			)
		}
	}
}
